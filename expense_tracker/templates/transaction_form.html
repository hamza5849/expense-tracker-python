
{% extends "base.html" %}

{% block title %}{{ heading }} — Expense Tracker{% endblock %}

{% block content %}

<header class="page-head">
  <div>
    <span class="eyebrow">Manage Your Finances</span>
    <h1 data-testid="page-title">{{ heading }}</h1>
    <p class="page-sub">
      Record your income and expenses to keep your finances organized.
    </p>
  </div>

  <a href="{{ url_for('transactions') }}" class="btn ghost" data-testid="cancel-btn">
    <i class="fa-solid fa-arrow-left"></i> Back to Transactions
  </a>
</header>

<div class="panel form-panel">

  <form method="POST" action="{{ form_action }}" class="form-grid" data-testid="tx-form">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <!-- Transaction Type -->
    <div class="type-toggle" data-testid="type-toggle">

      <input
        type="radio"
        id="type-income"
        name="type"
        value="income"
        {% if not tx or tx.type == 'income' %}checked{% endif %}
      />

      <label for="type-income" class="tt-opt in" data-testid="type-income">
        <i class="fa-solid fa-arrow-down"></i> Income
      </label>

      <input
        type="radio"
        id="type-expense"
        name="type"
        value="expense"
        {% if tx and tx.type == 'expense' %}checked{% endif %}
      />

      <label for="type-expense" class="tt-opt out" data-testid="type-expense">
        <i class="fa-solid fa-arrow-up"></i> Expense
      </label>

    </div>

    <!-- Amount -->
    <label class="field span-2">
      <span>Amount</span>

      <div class="input-prefix">
        <span class="prefix">Rs.</span>

        <input
          type="number"
          name="amount"
          step="0.01"
          min="0.01"
          required
          value="{{ tx.amount if tx else '' }}"
          data-testid="tx-amount"
          placeholder="0.00"
        />
      </div>
    </label>

    <!-- Category -->
    <label class="field">
      <span>Category</span>

      <select name="category" required data-testid="tx-category">
        {% for c in categories %}
          <option value="{{ c }}" {% if tx and tx.category == c %}selected{% endif %}>
            {{ c }}
          </option>
        {% endfor %}
      </select>
    </label>

    <!-- Date -->
    <label class="field">
      <span>Date</span>

      <input
        type="date"
        name="date"
        required
        value="{{ tx.date.strftime('%Y-%m-%d') if tx else '' }}"
        data-testid="tx-date"
      />
    </label>

    <!-- Description -->
    <label class="field span-2">
      <span>Description</span>

      <input
        type="text"
        name="description"
        maxlength="255"
        value="{{ tx.description if tx else '' }}"
        data-testid="tx-description"
        placeholder="e.g. Grocery shopping, salary, electricity bill"
      />
    </label>

    <!-- Form Actions -->
    <div class="form-actions span-2">

      <a href="{{ url_for('transactions') }}" class="btn ghost">
        Cancel
      </a>

      <button type="submit" class="btn primary" data-testid="tx-submit">
        {% if tx %}Update Transaction{% else %}Save Transaction{% endif %}
        <i class="fa-solid fa-check"></i>
      </button>

    </div>

  </form>

</div>

<script>
  // Automatically fill today's date when creating a new transaction
  (function () {
    const dateInput = document.querySelector('[data-testid="tx-date"]');

    if (dateInput && !dateInput.value) {
      dateInput.valueAsDate = new Date();
    }
  })();
</script>

{% endblock %}
